<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices sur le DOM</title>
    <link rel="stylesheet" href="dom.css">
</head>

<body>
    <header>
        <h1>Exercices supplémentaires </h1>
    </header>

    <main>
        <section id="quadrillage">
            <h2>Quadrillage coloré</h2>
            <div>
                <span id="1"></span>
                <span id="2"></span>
                <span id="3"></span>
                <span id="4"></span>
                <span id="5"></span>
                <span id="6"></span>
                <span id="7"></span>
                <span id="8"></span>
                <span id="9"></span>
            </div>
        </section>

        <section id="modale">
            <h2>Modale Caché :</h2>
            <button id="modalBtn">Clique pour afficher le modal caché.</button>
        </section>

        <section id="combinaison">
            <h2>Combinaison gagnante :</h2>
            <p id="para1">Appuyez sur P + D ( + F) pour effectuer les tests (X pour reset).</p>
            <p id="para2"></p>
        </section>

        <section id="survol">
            <h2>Hover size :</h2>
            <div>
                <span id="first_case">
                    <p> Un text</p>
                </span>
                <span id="second_case">
                    <p> Un text</p>
                </span>
                <span id="third_case">
                    <p> Un text</p>
                </span>
                <span id="fourth_case">
                    <p> Un text</p>
                </span>
            </div>
        </section>

        <section id="carrousel">
            <h2>Bonus : 🎠 Carrousel</h2>
            <div>
                <button id="button_image">
                    Affiche l'image
                </button>
                <div id="image">
                    <div id="left"></div>
                    <div id="right"></div>
                </div>
            </div>
        </section>
    </main>
</body>

<div id="modalCache">
    <p>Je suis le modal caché</p>
</div>

<script src="dom.js"></script>

</html>
